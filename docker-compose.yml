version: '3.9'

services:
  # ──────────────────────────────────────────────
  # PostgreSQL 16 + PostGIS 3.4
  # Single source of truth for application state.
  # PostGIS enables spatial queries (mine boundaries,
  # blast zones, incident proximity).
  # ──────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    container_name: koyla-postgres
    environment:
      POSTGRES_USER: koyla
      POSTGRES_PASSWORD: koyla_dev
      POSTGRES_DB: koyla_chain
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U koyla -d koyla_chain']
      interval: 5s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  # Redis 7
  # Used for: refresh token storage with TTL,
  # JWT blacklisting on logout, rate limiting
  # for sync endpoints. NOT on the critical path —
  # if Redis is down, JWT auth still works.
  # ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: koyla-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  # Core API — Node.js / Express
  # Handles: Auth, RBAC, CRUD, WatermelonDB sync,
  # PostGIS spatial queries, Swagger docs.
  # ──────────────────────────────────────────────
  core-api:
    build:
      context: ./services/core-api
      dockerfile: Dockerfile
    container_name: koyla-core-api
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: koyla
      DB_PASSWORD: koyla_dev
      DB_NAME: koyla_chain
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret-change-in-production-minimum-32-chars!!
      JWT_REFRESH_SECRET: dev-refresh-secret-change-in-production!!
      INTERNAL_API_KEY: dev-internal-api-key-change-in-production
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/core-api/src:/app/src:delegated
      - ./services/core-api/knexfile.js:/app/knexfile.js:delegated
    command: npm run dev

  # ──────────────────────────────────────────────
  # AI Service — Python / FastAPI
  # Handles: Hazard detection (YOLO/PaddleOCR).
  # Internal-only — not exposed to mobile clients.
  # Communicates with Core API via internal API key.
  # ──────────────────────────────────────────────
  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    container_name: koyla-ai-service
    ports:
      - '8000:8000'
    environment:
      INTERNAL_API_KEY: dev-internal-api-key-change-in-production
      PORT: 8000
    volumes:
      - ./services/ai-service/app:/app/app:delegated
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  redis_data:
